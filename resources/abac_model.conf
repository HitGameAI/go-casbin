# ============================================================
# ABAC 属性匹配模型配置（基于属性的访问控制）
# ============================================================
#
# ABAC 核心思想：根据请求中主体的属性动态判断权限
#   与 RBAC 不同，ABAC 不需要预定义策略规则（不需要 policy.csv）
#   权限完全由 matcher 中的属性表达式决定
#
# 典型场景：
#   "只有资源的所有者才能读取自己的资源"
#   "只有部门为 IT 的用户才能访问管理后台"
#   "只有年龄大于 18 的用户才能查看特定内容"
#
# 使用方式：
#   不需要 policy.csv 文件，只需 model.conf
#   调用 Enforce 时传入结构体对象而非字符串：
#     e.Enforce(sub, obj, act)
#     其中 sub/obj 是包含属性的结构体
# ============================================================

# 请求定义
# r = sub, obj, act
#   sub = 主体对象（包含属性的结构体），如 {Name: "alice", Age: 30}
#   obj = 客体对象（包含属性的结构体），如 {Owner: "alice", Type: "doc"}
#   act = 动作（字符串），如 "read"
#
# 注意：ABAC 中 sub 和 obj 是结构体，可以在 matcher 中用点号访问属性
# 例如 r.sub.Name、r.obj.Owner 等
[request_definition]
r = sub, obj, act

# 策略定义
# p = sub, obj, act
#   虽然定义了策略格式，但 ABAC 属性匹配模式下通常不使用策略文件
#   权限判断完全由 matcher 中的表达式完成
[policy_definition]
p = sub, obj, act

# 策略效果
# e = some(where (p.eft == allow))
#   只要有一条策略允许就通过
[policy_effect]
e = some(where (p.eft == allow))

# 匹配器
# m = r.sub == r.obj.Owner
#   核心逻辑：请求的主体(sub) 必须等于 资源的所有者(obj.Owner)
#
#   这是最简单的 ABAC 示例：只有资源的所有者才能访问
#   Enforce({Name:"alice"}, {Owner:"alice"}, "read")  → true  （alice 是自己的资源所有者）
#   Enforce({Name:"bob"},   {Owner:"alice"}, "read")  → false （bob 不是 alice 资源的所有者）
#
# 更复杂的 ABAC matcher 示例：
#   m = r.sub.Department == "IT" && r.act == "admin"        → 只有 IT 部门才能管理
#   m = r.sub.Age > 18 && r.obj.Type == "adult"             → 年龄大于 18 才能查看成人内容
#   m = r.sub.Role == "manager" && r.obj.Department == r.sub.Department  → 经理只能管理本部门资源
[matchers]
m = r.sub == r.obj.Owner
