# ============================================================
# RBAC 模型配置（基于角色的访问控制）
# ============================================================
#
# RBAC 核心思想：用户 → 角色 → 权限
#   用户不直接绑定资源权限，而是通过"角色"间接获得权限
#   例如：alice 属于 admin 角色 → admin 可以读写 data1 → alice 可以读写 data1
#
# 配置结构说明：
#   [request_definition]  请求定义：描述一次权限检查的输入参数
#   [policy_definition]   策略定义：描述一条策略规则的字段格式
#   [role_definition]     角色定义：描述角色继承关系的格式
#   [policy_effect]       策略效果：描述当多条策略匹配时的最终判定逻辑
#   [matchers]            匹配器：  描述请求与策略的匹配公式
# ============================================================

# 请求定义
# r = sub, obj, act
#   sub = 主体（谁在请求），如 "alice"、"bob"
#   obj = 客体（请求的资源），如 "data1"、"data2"
#   act = 动作（请求的操作），如 "read"、"write"
# 调用 Enforce("alice", "data1", "read") 时，三个参数分别对应 sub/obj/act
[request_definition]
r = sub, obj, act

# 策略定义
# p = sub, obj, act
#   sub = 主体（谁拥有权限）
#   obj = 客体（哪个资源）
#   act = 动作（什么操作）
# 对应 policy.csv 中的：p, alice, data1, read
[policy_definition]
p = sub, obj, act

# 角色定义
# g = _, _
#   第一个 _ = 用户（谁属于角色）
#   第二个 _ = 角色（属于哪个角色）
# 两个下划线表示只有两层关系（用户 → 角色），没有角色嵌套
# 对应 policy.csv 中的：g, alice, admin（alice 属于 admin 角色）
#
# 如果需要角色嵌套（角色继承角色），改为 g = _, _, _
# 例如：g, admin, superadmin 表示 admin 继承 superadmin 的权限
[role_definition]
g = _, _

# 策略效果
# e = some(where (p.eft == allow))
#   含义：只要有一条策略的判定结果是 allow，最终结果就是允许
#   p.eft = 策略的效果（默认为 allow）
#   some(where (...)) = 存在至少一条满足条件的策略
#
# 其他常见效果：
#   e = !some(where (p.eft == deny))   → 只要没有 deny 就允许（默认允许）
#   e = some(where (p.eft == allow)) && !some(where (p.eft == deny)) → allow 优先但 deny 覆盖
[policy_effect]
e = some(where (p.eft == allow))

# 匹配器
# m = g(r.sub, p.sub) && r.obj == p.obj && r.act == p.act
#   g(r.sub, p.sub)    = 检查请求的用户是否属于策略中定义的角色
#                        例如 r.sub="alice", p.sub="admin" → 检查 alice 是否属于 admin
#   r.obj == p.obj     = 请求的资源与策略的资源一致
#   r.act == p.act     = 请求的动作与策略的动作一致
#
# 三个条件同时满足时，该策略匹配成功
[matchers]
m = g(r.sub, p.sub) && r.obj == p.obj && r.act == p.act
