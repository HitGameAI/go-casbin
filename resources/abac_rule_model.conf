# ============================================================
# ABAC 规则策略模型配置（基于属性的访问控制 - 规则模式）
# ============================================================
#
# 与 abac_model.conf 的区别：
#   abac_model.conf    → 纯属性匹配，不需要策略文件，matcher 写死在 model 中
#   abac_rule_model.conf → 规则策略模式，条件表达式存储在策略文件中，支持动态管理
#
# 为什么用规则策略模式？
#   1. 纯属性匹配的 matcher 是写死的，修改需要重启服务
#   2. 规则策略模式把条件表达式存到策略文件/数据库，可以运行时动态增删
#   3. 适合需要频繁调整权限规则的业务场景
#
# 关键设计：p = sub_rule, obj, act
#   sub_rule = 条件表达式字符串（而非固定的用户名/角色名）
#   在 matcher 中通过 eval(p.sub_rule) 动态执行表达式
# ============================================================

# 请求定义
# r = sub, obj, act
#   sub = 主体（字符串），如 "alice"、"bob"
#   obj = 客体（字符串），如 "data1"、"data2"
#   act = 动作（字符串），如 "read"、"write"
[request_definition]
r = sub, obj, act

# 策略定义
# p = sub_rule, obj, act
#   sub_rule = 条件表达式（字符串），对请求主体 r.sub 进行条件判断
#   obj      = 资源名称
#   act      = 操作名称
#
# 为什么叫 sub_rule 而不是 sub？
#   在 RBAC 中 p.sub 是固定的用户名/角色名（如 "alice"、"admin"）
#   在 ABAC 规则模式中 p.sub_rule 是一个条件表达式（如 `r.sub == "alice"`）
#   命名为 sub_rule 强调这是一个规则表达式，不是固定值
#
# 对应 policy.csv 示例：
#   p, r.sub == "alice", data1, read    → 如果请求用户是 alice，允许读取 data1
#   p, r.sub != "eve", data3, read      → 如果请求用户不是 eve，允许读取 data3
[policy_definition]
p = sub_rule, obj, act

# 策略效果
[policy_effect]
e = some(where (p.eft == allow))

# 匹配器
# m = eval(p.sub_rule) && r.obj == p.obj && r.act == p.act
#
#   eval(p.sub_rule)  → 动态执行策略中的条件表达式
#     这是 ABAC 规则模式的核心！
#     eval() 函数会把 p.sub_rule 的字符串当作表达式来执行
#     例如 p.sub_rule = `r.sub == "alice"` → eval 执行后检查 r.sub 是否等于 "alice"
#
#   r.obj == p.obj    → 请求的资源与策略的资源一致
#   r.act == p.act    → 请求的动作与策略的动作一致
#
# 支持的条件表达式语法：
#   r.sub == "alice"              → 等于判断
#   r.sub != "eve"                → 不等于判断
#   r.sub in ("alice", "bob")     → 包含判断（IN 操作符）
#   r.sub.Role == "admin"         → 属性访问（sub 为结构体时）
#   r.sub.Age > 18                → 数值比较
[matchers]
m = eval(p.sub_rule) && r.obj == p.obj && r.act == p.act
