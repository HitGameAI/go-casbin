# ============================================================
# 多租户 RBAC 模型配置（RBAC with Domains）
# ============================================================
#
# 什么是 Domains（域/租户）？
#   在标准 RBAC 中，角色是全局的（admin 就是 admin，不分租户）
#   在多租户场景中，不同租户的同名角色权限不同：
#     租户1 的 admin 可以管理 data1
#     租户2 的 admin 只能管理 data2
#   Domains 就是在角色和权限之间增加一个"租户"维度
#
# 与标准 RBAC 的区别：
#   标准 RBAC：r = sub, obj, act           → 3 个参数
#   多租户 RBAC：r = sub, dom, obj, act    → 4 个参数（多了 dom 租户标识）
#
#   标准 RBAC：g = _, _                    → 2 个下划线（用户 → 角色）
#   多租户 RBAC：g = _, _, _               → 3 个下划线（用户 → 角色 → 租户）
# ============================================================

# 请求定义
# r = sub, dom, obj, act
#   sub = 主体（谁在请求），如 "alice"
#   dom = 域/租户（在哪个租户下），如 "tenant1"
#   obj = 客体（请求的资源），如 "data1"
#   act = 动作（请求的操作），如 "read"
# 调用 Enforce("alice", "tenant1", "data1", "read")
[request_definition]
r = sub, dom, obj, act

# 策略定义
# p = sub, dom, obj, act
#   sub = 主体（角色名），如 "admin"
#   dom = 域/租户，如 "tenant1"
#   obj = 客体（资源），如 "data1"
#   act = 动作，如 "read"
# 对应 policy.csv：p, admin, tenant1, data1, read
[policy_definition]
p = sub, dom, obj, act

# 角色定义
# g = _, _, _
#   第一个 _ = 用户（谁属于角色）
#   第二个 _ = 角色（属于哪个角色）
#   第三个 _ = 域/租户（在哪个租户下属于该角色）
#
# 为什么是 3 个下划线？
#   标准 RBAC：g, alice, admin           → alice 属于 admin（全局）
#   多租户 RBAC：g, alice, admin, tenant1 → alice 在 tenant1 下属于 admin
#
#   同一个用户在不同租户下可以有不同角色：
#     g, alice, admin, tenant1   → alice 在 tenant1 是 admin
#     g, alice, viewer, tenant2  → alice 在 tenant2 只是 viewer
[role_definition]
g = _, _, _

# 策略效果
[policy_effect]
e = some(where (p.eft == allow))

# 匹配器
# m = g(r.sub, p.sub, r.dom) && r.dom == p.dom && r.obj == p.obj && r.act == p.act
#
#   g(r.sub, p.sub, r.dom)  → 检查请求用户在请求租户下是否属于策略中的角色
#     例如 r.sub="alice", p.sub="admin", r.dom="tenant1"
#     → 检查 alice 在 tenant1 下是否属于 admin
#
#   r.dom == p.dom  → 请求的租户与策略的租户必须一致（租户隔离）
#   r.obj == p.obj  → 资源匹配
#   r.act == p.act  → 操作匹配
#
# 注意：r.dom == p.dom 确保了租户隔离
#   即使两个租户都有 admin 角色，tenant1 的 admin 权限不会泄露到 tenant2
[matchers]
m = g(r.sub, p.sub, r.dom) && r.dom == p.dom && r.obj == p.obj && r.act == p.act
