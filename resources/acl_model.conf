# ============================================================
# ACL 模型配置（访问控制列表）
# ============================================================
#
# ACL 核心思想：直接绑定 用户 → 资源 → 操作
#   最简单最基础的权限模型，每个用户直接绑定到具体资源的具体操作
#   没有角色概念，没有继承关系
#
# 与 RBAC 的区别：
#   ACL：  alice → data1 → read（用户直接绑定资源）
#   RBAC： alice → admin → data1 → read（用户通过角色间接绑定资源）
#
# 适用场景：
#   - 小型系统，用户少、资源少
#   - 不需要角色管理的简单权限控制
#   - 需要精确到每个用户每个资源的细粒度控制
#
# 缺点：
#   - 用户多时策略爆炸（每个用户每条资源都要写一行）
#   - 无法批量管理（修改某个用户组的权限需要逐条修改）
# ============================================================

# 请求定义
# r = sub, obj, act
#   sub = 主体（谁在请求），如 "alice"
#   obj = 客体（请求的资源），如 "data1"
#   act = 动作（请求的操作），如 "read"
[request_definition]
r = sub, obj, act

# 策略定义
# p = sub, obj, act
#   sub = 主体（谁拥有权限）
#   obj = 客体（哪个资源）
#   act = 动作（什么操作）
# 对应 policy.csv：p, alice, data1, read
[policy_definition]
p = sub, obj, act

# 策略效果
[policy_effect]
e = some(where (p.eft == allow))

# 匹配器
# m = r.sub == p.sub && r.obj == p.obj && r.act == p.act
#   r.sub == p.sub  → 请求的用户与策略的用户完全一致
#   r.obj == p.obj  → 请求的资源与策略的资源完全一致
#   r.act == p.act  → 请求的操作与策略的操作完全一致
#
# 与 RBAC matcher 的区别：
#   ACL：  r.sub == p.sub（用户直接匹配）
#   RBAC： g(r.sub, p.sub)（通过角色间接匹配）
[matchers]
m = r.sub == p.sub && r.obj == p.obj && r.act == p.act
